name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        shell: bash
        run: |
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
          .\dotnet-install.ps1 -Channel 10.0 -Quality preview
          echo "$env:LOCALAPPDATA\Microsoft\dotnet" >> $env:GITHUB_PATH

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore NexusStrap/NexusStrap.csproj

      - name: Build
        run: dotnet build NexusStrap/NexusStrap.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish NexusStrap/NexusStrap.csproj -c Release --no-build
          -r win-x64
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Rename exe with version
        shell: bash
        run: |
          mv "NexusStrap/bin/Release/net10.0-windows/win-x64/publish/NexusStrap.exe" "NexusStrap-${{ steps.version.outputs.VERSION }}.exe"

      - name: Sign exe (if certificate secrets provided)
        if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /v "NexusStrap-${{ steps.version.outputs.VERSION }}.exe"
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexusStrap v${{ steps.version.outputs.VERSION }}
          files: NexusStrap-${{ steps.version.outputs.VERSION }}.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
